name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Verify distribution contract
        run: python3 scripts/verify-distribution.py

      - name: Verify release tooling syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/resolve-release-version.py scripts/create-release-manifest.py
          output="$(python3 scripts/resolve-release-version.py v1.2.3)"
          grep -qx 'version_name=1.2.3' <<< "$output"
          grep -qx 'version_code=1002003' <<< "$output"

      - name: Build and lint
        run: ./gradlew build lint --stacktrace

      - name: Verify release signing path
        shell: bash
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/sailens-ci-upload.jks"
          keytool -genkeypair -noprompt -storetype JKS -keystore "$keystore" -storepass ci-password -keypass ci-password -alias ci-upload -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Sailens CI, O=Sailens, C=US"
          SAILENS_UPLOAD_KEYSTORE="$keystore" SAILENS_UPLOAD_STORE_PASSWORD=ci-password SAILENS_UPLOAD_KEY_ALIAS=ci-upload SAILENS_UPLOAD_KEY_PASSWORD=ci-password ./gradlew :app:bundleRelease -Psailens.versionName=0.0.1 -Psailens.versionCode=1 --no-configuration-cache --stacktrace
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab

      - name: Verify release manifest generation
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/sailens-ci-source"
          rm -rf "$source_dir"
          mkdir -p "$source_dir"
          git archive HEAD | tar -x -C "$source_dir"
          rm -rf "$source_dir/sailens"
          mkdir -p "$source_dir/sailens"
          git -C sailens archive HEAD | tar -x -C "$source_dir/sailens"
          mkdir -p dist
          source_archive="dist/sailens-ci-source.tar.gz"
          tar -czf "$GITHUB_WORKSPACE/$source_archive" -C "$RUNNER_TEMP" "$(basename "$source_dir")"
          manifest="dist/release-manifest-ci.json"
          python3 scripts/create-release-manifest.py --tag v0.0.1 --version-name 0.0.1 --version-code 1 --aab app/build/outputs/bundle/release/app-release.aab --source-archive "$source_archive" --output "$manifest"
          python3 -c 'import json, pathlib, sys; data=json.loads(pathlib.Path(sys.argv[1]).read_text()); assert data["tag"] == "v0.0.1"; assert data["versionCode"] == 1; assert len(data["source"]["commit"]) == 40; assert len(data["source"]["platformCommit"]) == 40; assert len(data["models"]["semantic"]["sha256"]) == 64; assert len(data["models"]["detection"]["sha256"]) == 64; assert len(data["artifacts"]["appBundle"]["sha256"]) == 64; assert len(data["artifacts"]["correspondingSourceArchive"]["sha256"]) == 64' "$manifest"
