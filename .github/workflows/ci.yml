name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Verify distribution contract
        run: python3 scripts/verify-distribution.py

      - name: Verify release tooling syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/resolve-release-version.py scripts/create-release-manifest.py
          output="$(python3 scripts/resolve-release-version.py v1.2.3)"
          grep -qx 'version_name=1.2.3' <<< "$output"
          grep -qx 'version_code=1002003' <<< "$output"

      - name: Build and lint
        run: ./gradlew build lint --stacktrace
