name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: internal
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Resolve release version
        id: version
        shell: bash
        run: python3 scripts/resolve-release-version.py "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify tag commit is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          release_commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "::error::Release tag must point to a commit reachable from origin/main."
            exit 1
          fi

      - name: Verify distribution contract
        run: python3 scripts/verify-distribution.py

      - name: Verify release secrets
        shell: bash
        env:
          SAILENS_UPLOAD_KEYSTORE_BASE64: ${{ secrets.SAILENS_UPLOAD_KEYSTORE_BASE64 }}
          SAILENS_UPLOAD_STORE_PASSWORD: ${{ secrets.SAILENS_UPLOAD_STORE_PASSWORD }}
          SAILENS_UPLOAD_KEY_ALIAS: ${{ secrets.SAILENS_UPLOAD_KEY_ALIAS }}
          SAILENS_UPLOAD_KEY_PASSWORD: ${{ secrets.SAILENS_UPLOAD_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          missing=0
          for name in SAILENS_UPLOAD_KEYSTORE_BASE64 SAILENS_UPLOAD_STORE_PASSWORD SAILENS_UPLOAD_KEY_ALIAS SAILENS_UPLOAD_KEY_PASSWORD PLAY_SERVICE_ACCOUNT_JSON; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required release secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Materialize upload keystore
        shell: bash
        env:
          SAILENS_UPLOAD_KEYSTORE_BASE64: ${{ secrets.SAILENS_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/sailens-upload.jks"
          printf '%s' "$SAILENS_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "SAILENS_UPLOAD_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Build, test and lint signed release
        env:
          SAILENS_UPLOAD_STORE_PASSWORD: ${{ secrets.SAILENS_UPLOAD_STORE_PASSWORD }}
          SAILENS_UPLOAD_KEY_ALIAS: ${{ secrets.SAILENS_UPLOAD_KEY_ALIAS }}
          SAILENS_UPLOAD_KEY_PASSWORD: ${{ secrets.SAILENS_UPLOAD_KEY_PASSWORD }}
        run: >
          ./gradlew build lint :app:bundleRelease
          -Psailens.versionName="${{ steps.version.outputs.version_name }}"
          -Psailens.versionCode="${{ steps.version.outputs.version_code }}"
          --no-configuration-cache
          --stacktrace

      - name: Verify signed app bundle
        shell: bash
        run: |
          set -euo pipefail
          aab="app/build/outputs/bundle/release/app-release.aab"
          test -s "$aab"
          jarsigner -verify -strict "$aab"

      - name: Prepare release artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version_name }}"
          mkdir -p dist
          aab="dist/sailens-$version.aab"
          cp app/build/outputs/bundle/release/app-release.aab "$aab"
          source_dir="$RUNNER_TEMP/sailens-$version-source"
          rm -rf "$source_dir"
          mkdir -p "$source_dir"
          git archive HEAD | tar -x -C "$source_dir"
          rm -rf "$source_dir/sailens"
          mkdir -p "$source_dir/sailens"
          git -C sailens archive HEAD | tar -x -C "$source_dir/sailens"
          source_archive="dist/sailens-$version-source.tar.gz"
          tar -czf "$GITHUB_WORKSPACE/$source_archive" -C "$RUNNER_TEMP" "$(basename "$source_dir")"
          manifest="dist/release-manifest.json"
          python3 scripts/create-release-manifest.py --tag "$GITHUB_REF_NAME" --version-name "$version" --version-code "${{ steps.version.outputs.version_code }}" --aab "$aab" --source-archive "$source_archive" --output "$manifest"
          echo "aab=$aab" >> "$GITHUB_OUTPUT"
          echo "source_archive=$source_archive" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::A published GitHub Release already exists for $tag."
              exit 1
            fi
            gh release upload "$tag" "${{ steps.artifacts.outputs.aab }}" "${{ steps.artifacts.outputs.manifest }}" "${{ steps.artifacts.outputs.source_archive }}" --clobber
          else
            gh release create "$tag" "${{ steps.artifacts.outputs.aab }}" "${{ steps.artifacts.outputs.manifest }}" "${{ steps.artifacts.outputs.source_archive }}" --verify-tag --draft --generate-notes --title "Sailens ${{ steps.version.outputs.version_name }}"
          fi

      - name: Upload to Google Play Internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.sailens
          releaseFile: ${{ steps.artifacts.outputs.aab }}
          releaseName: ${{ github.ref_name }}
          track: internal
          status: completed
          mappingFile: app/build/outputs/mapping/release/mapping.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
