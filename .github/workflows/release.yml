name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: github
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Resolve release version
        id: version
        shell: bash
        run: python3 scripts/resolve-release-version.py "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify tag commit is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          release_commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "::error::Release tag must point to a commit reachable from origin/main."
            exit 1
          fi

      - name: Verify distribution contract
        run: python3 scripts/verify-distribution.py

      - name: Verify app-signing secrets
        shell: bash
        env:
          SAILENS_APP_SIGNING_KEYSTORE_BASE64: ${{ secrets.SAILENS_APP_SIGNING_KEYSTORE_BASE64 }}
          SAILENS_APP_SIGNING_STORE_PASSWORD: ${{ secrets.SAILENS_APP_SIGNING_STORE_PASSWORD }}
          SAILENS_APP_SIGNING_KEY_ALIAS: ${{ secrets.SAILENS_APP_SIGNING_KEY_ALIAS }}
          SAILENS_APP_SIGNING_KEY_PASSWORD: ${{ secrets.SAILENS_APP_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in SAILENS_APP_SIGNING_KEYSTORE_BASE64 SAILENS_APP_SIGNING_STORE_PASSWORD SAILENS_APP_SIGNING_KEY_ALIAS SAILENS_APP_SIGNING_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required release secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Materialize app-signing keystore
        shell: bash
        env:
          SAILENS_APP_SIGNING_KEYSTORE_BASE64: ${{ secrets.SAILENS_APP_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/sailens-app-signing.p12"
          printf '%s' "$SAILENS_APP_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "SAILENS_APP_SIGNING_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Verify app-signing identity
        shell: bash
        env:
          SAILENS_APP_SIGNING_STORE_PASSWORD: ${{ secrets.SAILENS_APP_SIGNING_STORE_PASSWORD }}
          SAILENS_APP_SIGNING_KEY_ALIAS: ${{ secrets.SAILENS_APP_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          export SAILENS_KEYTOOL_STORE_PASSWORD="$SAILENS_APP_SIGNING_STORE_PASSWORD"
          expected="$(tr '[:upper:]' '[:lower:]' < release/app-signing-certificate.sha256 | tr -d ':[:space:]')"
          actual="$(keytool -exportcert -keystore "$SAILENS_APP_SIGNING_KEYSTORE" -storetype PKCS12 -alias "$SAILENS_APP_SIGNING_KEY_ALIAS" -storepass:env SAILENS_KEYTOOL_STORE_PASSWORD | python3 -c 'import hashlib, sys; print(hashlib.sha256(sys.stdin.buffer.read()).hexdigest())')"
          [[ "$actual" == "$expected" ]] || {
            echo "::error::Configured app-signing secret does not match the pinned Sailens signing identity."
            exit 1
          }

      - name: Build, test and lint signed APK
        env:
          SAILENS_APP_SIGNING_STORE_PASSWORD: ${{ secrets.SAILENS_APP_SIGNING_STORE_PASSWORD }}
          SAILENS_APP_SIGNING_KEY_ALIAS: ${{ secrets.SAILENS_APP_SIGNING_KEY_ALIAS }}
          SAILENS_APP_SIGNING_KEY_PASSWORD: ${{ secrets.SAILENS_APP_SIGNING_KEY_PASSWORD }}
        run: >
          ./gradlew build lint :app:assembleRelease
          -Psailens.versionName="${{ steps.version.outputs.version_name }}"
          -Psailens.versionCode="${{ steps.version.outputs.version_code }}"
          --no-configuration-cache
          --stacktrace

      - name: Verify signed APK
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apksigner.txt"
          cert_sha="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          [[ "$cert_sha" =~ ^[0-9a-f]{64}$ ]]
          expected="$(tr '[:upper:]' '[:lower:]' < release/app-signing-certificate.sha256 | tr -d ':[:space:]')"
          [[ "$cert_sha" == "$expected" ]] || {
            echo "::error::Built APK signer does not match the pinned Sailens signing identity."
            exit 1
          }
          echo "signing_cert_sha256=$cert_sha" >> "$GITHUB_OUTPUT"

      - name: Prepare release artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version_name }}"
          mkdir -p dist
          apk="dist/sailens-$version.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          source_dir="$RUNNER_TEMP/sailens-$version-source"
          rm -rf "$source_dir"
          mkdir -p "$source_dir"
          git archive HEAD | tar -x -C "$source_dir"
          rm -rf "$source_dir/sailens"
          mkdir -p "$source_dir/sailens"
          git -C sailens archive HEAD | tar -x -C "$source_dir/sailens"
          source_archive="dist/sailens-$version-source.tar.gz"
          tar -czf "$GITHUB_WORKSPACE/$source_archive" -C "$RUNNER_TEMP" "$(basename "$source_dir")"
          manifest="dist/release-manifest.json"
          python3 scripts/create-release-manifest.py --tag "$GITHUB_REF_NAME" --version-name "$version" --version-code "${{ steps.version.outputs.version_code }}" --apk "$apk" --signing-cert-sha256 "${{ steps.signing.outputs.signing_cert_sha256 }}" --source-archive "$source_archive" --output "$manifest"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "source_archive=$source_archive" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::A published GitHub Release already exists for $tag."
              exit 1
            fi
            gh release upload "$tag" "${{ steps.artifacts.outputs.apk }}" "${{ steps.artifacts.outputs.manifest }}" "${{ steps.artifacts.outputs.source_archive }}" --clobber
          else
            gh release create "$tag" "${{ steps.artifacts.outputs.apk }}" "${{ steps.artifacts.outputs.manifest }}" "${{ steps.artifacts.outputs.source_archive }}" --verify-tag --draft --generate-notes --title "Sailens ${{ steps.version.outputs.version_name }}"
          fi

